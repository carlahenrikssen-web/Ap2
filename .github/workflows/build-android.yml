name: Build Android (TB-8505F, Android 10)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config wget

      - name: Locate source
        run: |
          FOUND=""
          for d in tr4mpass_bundle/src tr4mpass_source .; do
            if [ -f "$d/Makefile" ]; then echo "SRCDIR=$d" >> "$GITHUB_ENV"; FOUND=1; break; fi
          done
          [ -n "$FOUND" ] || { echo "ERROR: source dir not found"; exit 1; }

      - name: Detect NDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          [ -n "$NDK" ] || { echo "ERROR: NDK not found"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Cross-compile dependencies + tr4mpass (arm64, API 29)
        env:
          ANDROID_NDK_HOME: ${{ env.NDK }}
        run: bash "$SRCDIR/build-android.sh"

      - name: Embed binary into APK project
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp out/tr4mpass-arm64 android/app/src/main/jniLibs/arm64-v8a/libtr4mpass.so

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: cd android && gradle assembleDebug --no-daemon

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: tr4mpass-android-binary
          path: out/tr4mpass-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tr4mpass-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
