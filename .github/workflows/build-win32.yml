name: Build Windows 32-bit exe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 make autoconf automake libtool \
            pkg-config texinfo wget file

      - name: Locate build scripts
        run: |
          SCRIPTS=""
          for d in tr4mpass_bundle/src tr4mpass_source .; do
            if [ -f "$d/build-win32.sh" ] && [ -f "$d/build-tr4mpass-win32.sh" ]; then
              SCRIPTS="$d"; break
            fi
          done
          if [ -z "$SCRIPTS" ]; then
            echo "ERROR: build-win32.sh / build-tr4mpass-win32.sh not found in repo"
            exit 1
          fi
          echo "SCRIPTS=$SCRIPTS" >> "$GITHUB_ENV"

      - name: Cross-compile dependencies
        run: bash "$SCRIPTS/build-win32.sh"

      - name: Build tr4mpass.exe (i686 / Windows 10 32-bit)
        run: |
          cd "$SCRIPTS"
          bash build-tr4mpass-win32.sh
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -f tr4mpass.exe "$GITHUB_WORKSPACE/out/tr4mpass-win32.exe"

      - name: Collect runtime DLLs
        run: |
          cd "$SCRIPTS"
          mkdir -p "$GITHUB_WORKSPACE/out/dlls"
          cp -f win32dll/*.dll "$GITHUB_WORKSPACE/out/dlls/" 2>/dev/null || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr4mpass-win32
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-win32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tr4mpass-win32
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**
